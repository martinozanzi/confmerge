name: Build Windows

# Compila ConfMerge.exe su Windows a ogni push su main (e a richiesta) e pubblica i file come artefatti.
# Con un tag di versione (es. 1.2.0 oppure v1.2.0) crea anche la Release con i pacchetti, e la versione dell'app
# diventa quella del tag. A richiesta (Run workflow) si può scrivere un tag già esistente: l'exe va nella sua Release.
on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag di una release già pubblicata a cui allegare l'exe (vuoto = solo artefatto)"
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"      # tutte le azioni girano su Node 24 (Node 20 è in dismissione)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Versione dal tag
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          if ($env:TAG) {
            $v = $env:TAG -replace '^v', ''
            (Get-Content src\confmerge\__init__.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content src\confmerge\__init__.py
            Select-String -Path src\confmerge\__init__.py -Pattern '__version__'
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"      # include tkinter (serve allo splash screen)

      # build.bat usa un .venv già presente: lo creiamo noi con la versione scelta sopra
      - name: Ambiente virtuale
        shell: cmd
        run: python -m venv .venv

      - name: Test rapidi (senza ffmpeg)
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          set QT_QPA_PLATFORM=offscreen
          set PYTHONPATH=src
          python -m pytest -q tests/test_sync.py tests/test_trim_detect.py tests/test_media_scan.py tests/test_estimator.py tests/test_settings_queue.py tests/test_state_model.py tests/test_text_renderer.py

      - name: Build (onefile + onedir)
        shell: cmd
        run: build.bat

      - name: Autotest dell'app impacchettata
        shell: pwsh
        run: |
          foreach ($exe in @("dist\onefile\ConfMerge.exe", "dist\onedir\ConfMerge\ConfMerge.exe")) {
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
            Write-Host "$exe -> codice di uscita $($p.ExitCode)"
            Get-Content "$env:LOCALAPPDATA\ConfMerge\selftest.txt"
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - name: Impacchetta la versione a cartella
        shell: pwsh
        run: Compress-Archive -Path dist\onedir\ConfMerge -DestinationPath dist\ConfMerge-cartella.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ConfMerge-windows
          path: |
            dist/onefile/ConfMerge.exe
            dist/onefile/THIRD-PARTY-NOTICES.txt
            dist/onefile/LICENSE.txt
            dist/ConfMerge-cartella.zip
          if-no-files-found: error

      - name: Release (con un tag di versione)
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/onefile/ConfMerge.exe
            dist/onefile/THIRD-PARTY-NOTICES.txt
            dist/ConfMerge-cartella.zip
