[project]
name = "confmerge"
version = "1.1.0"
description = "Prepara video di conferenze per YouTube"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martino Zanzi" }]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
confmerge-cli = "confmerge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
